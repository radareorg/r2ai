name: CI and Release

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]*'
#  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.build_system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        build_system: [make, meson]
        exclude:
          - os: windows-latest
            build_system: make

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Meson/Ninja
        if: matrix.build_system == 'meson'
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Install radare2
        id: r2
        uses: radareorg/github-actions@v3

      - name: Build with Make
        if: matrix.build_system == 'make'
        run: make -C src

      - name: Build with Meson (Unix)
        if: matrix.build_system == 'meson' && matrix.os != 'windows-latest'
        run: |
          cd src
          meson setup build || meson configure build
          meson compile -C build

      - name: Build with Meson (Windows)
        if: matrix.build_system == 'meson' && matrix.os == 'windows-latest'
        shell: powershell
        run: |
          cd src
          $prefix = "${{ steps.r2.outputs.prefix }}"
          meson setup build --backend ninja --prefix="$prefix" -Dr2_prefix="$prefix"
          if ($LASTEXITCODE -ne 0) { meson configure build }
          meson compile -C build

  bindist:
    name: Build r2pm binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install radare2
        uses: radareorg/github-actions@v3

      - name: Package r2pm binary
        run: make -C src bindist

      - name: Upload r2pm binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindist-${{ matrix.os }}
          path: r2ai-*.zip
          if-no-files-found: error

  windows-bindist:
    name: Build r2pm binary (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Meson/Ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja

      - name: Install radare2
        id: r2
        uses: radareorg/github-actions@v3

      - name: Build with Meson
        shell: powershell
        run: |
          cd src
          $prefix = "${{ steps.r2.outputs.prefix }}"
          meson setup build --backend ninja --prefix="$prefix" -Dr2_prefix="$prefix"
          if ($LASTEXITCODE -ne 0) { meson configure build }
          meson compile -C build

      - name: Package r2pm binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bindist\plugins,bindist\bin,bindist\prompts | Out-Null
          Get-ChildItem src\build\ -Filter "*r2ai*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination bindist\plugins
          Get-ChildItem src\..\build\ -Filter "*r2ai*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination bindist\plugins
          Copy-Item src\build\r2ai.exe bindist\bin
          Copy-Item prompts\*.r2ai.md bindist\prompts
          $rv = (& radare2 -qv).Trim()
          Compress-Archive -Path bindist\* -DestinationPath "r2ai-$rv-windows-x86-64.zip" -Force

      - name: Upload r2pm binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bindist
          path: r2ai-*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [bindist, windows-bindist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag is on master
        run: |
          git fetch origin master:refs/remotes/origin/master
          if ! git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            echo "Tag commit is not on origin/master — skipping release."
            exit 0
          fi

      - name: Download r2pm binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*bindist*'
          path: release-artifacts
          merge-multiple: true

      - name: Add decai.r2.js to release artifacts
        run: cp decai/decai.r2.js release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.zip
            release-artifacts/decai.r2.js
          generate_release_notes: true